# Demo pública Render Free (SQLite efímera).
# New → Blueprint → este repo  ·  o Web Service + plan Free
# Rate limits de production van acá (el .env es solo local).

services:
  - type: web
    name: bgvault
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: HOST
        value: "0.0.0.0"
      - key: SQLITE_PATH
        value: /tmp/bgvault.sqlite
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_LIMIT_IP_MAX
        value: "40"
      - key: RATE_LIMIT_IP_WINDOW_MS
        value: "600000"
      - key: RATE_LIMIT_AUTH_MAX
        value: "20"
      - key: RATE_LIMIT_AUTH_WINDOW_MS
        value: "600000"
      - key: RATE_LIMIT_REVEAL_MAX
        value: "120"
      - key: RATE_LIMIT_REVEAL_WINDOW_MS
        value: "60000"
